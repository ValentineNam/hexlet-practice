<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM: Карточка партнера</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar"><a class="brand" href="index.html" id="homeLink"><img src="favicon.svg" alt="" width="36" height="36" /><span>CRM <i>/</i> Партнеры</span></a><span class="topbar-note">Партнеры по продажам</span></header>
      <main id="editWindow">
        <div class="page-heading"><div><p class="eyebrow" id="editMode">Добавление</p><h1 id="editTitle">Карточка партнера</h1></div><button class="button button-secondary" id="backButton" type="button">← Назад</button></div>
        <p class="form-context" id="formContext"></p>
        <form id="partnerForm" class="partner-form" novalidate>
          <section class="form-section"><div class="section-heading"><span>01</span><div><h2>О компании</h2><p>Основные сведения партнера</p></div></div><div class="field-grid">
            <label class="field field-wide">Наименование *<input name="company_name" maxlength="255" autocomplete="organization" required /></label>
            <label class="field">Тип партнера *<select name="partner_type" required><option value="" disabled selected>Выберите тип</option><option>ООО</option><option>АО</option><option>ЗАО</option><option>ИП</option><option>ПАО</option></select></label>
            <label class="field">ИНН *<input name="inn" inputmode="numeric" pattern="([0-9]{10}|[0-9]{12})" minlength="10" maxlength="12" placeholder="10 или 12 цифр" required /><small>10 цифр для организации, 12 для ИП</small></label>
            <label class="field">Рейтинг *<input name="rating" type="number" min="0" max="2147483647" step="1" required /><small>Целое число от 0 до 2147483647</small></label>
            <label class="field">Адрес<input name="address" maxlength="500" autocomplete="street-address" /></label>
          </div></section>
          <section class="form-section"><div class="section-heading"><span>02</span><div><h2>Контакты</h2><p>Связь и ответственное лицо</p></div></div><div class="field-grid">
            <label class="field field-wide">ФИО директора<input name="director" maxlength="255" autocomplete="name" /></label>
            <label class="field">Телефон<input name="phone" type="tel" maxlength="20" placeholder="+7 (999) 123-45-67" /><small>Например: +7 (999) 123-45-67</small></label>
            <label class="field">Email *<input name="email" type="email" maxlength="255" placeholder="name@company.ru" required /><small>Например: name@company.ru</small></label>
          </div></section>
          <p id="formStatus" class="form-status" aria-live="polite"></p>
          <div class="form-actions"><button class="button button-secondary" id="cancelButton" type="button">Отмена</button><button class="button button-primary" id="saveButton" type="submit">Сохранить</button></div>
        </form>
      </main>
      <footer class="app-footer"><span>Партнерская сеть</span><span>CRM · 2026</span></footer>
    </div>
    <dialog class="message-dialog" id="messageDialog" aria-labelledby="dialogTitle" aria-describedby="dialogMessage"><div class="dialog-content"><span id="dialogIcon" class="dialog-icon" aria-hidden="true"></span><div><h2 id="dialogTitle"></h2><p id="dialogMessage"></p></div></div><div class="dialog-actions" id="dialogActions"></div></dialog>
    <script type="module" src="partner-edit-app.js"></script>
  </body>
</html>
