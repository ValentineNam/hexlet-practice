<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7e8e4" />
    <title>CRM: История реализации продукции</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="CRM, реестр партнеров">
          <img src="assets/favicon.svg" alt="" width="36" height="36" />
          <span>CRM <span class="brand-divider">/</span> Партнеры</span>
        </a>
        <span class="topbar-note">Партнеры по продажам</span>
      </header>
      <main id="partnerHistoryWindow" aria-labelledby="historyTitle">
        <div class="page-heading">
          <div>
            <p class="eyebrow">История продаж</p>
            <h1 id="historyTitle">История реализации продукции</h1>
          </div>
          <a class="button button-secondary" href="index.html">
            <span class="button-icon" aria-hidden="true">←</span>
            К реестру
          </a>
        </div>
        <div class="history-partner" id="partnerSummary" hidden>
          <span class="history-mark" id="partnerMark" aria-hidden="true"></span>
          <div><span class="history-label">Партнер</span><h2 id="partnerName"></h2></div>
          <span class="history-count" id="shipmentCount"></span>
        </div>
        <div id="historyMessage" class="empty-state" role="status">Загрузка истории...</div>
        <div id="historyTableWrap" class="history-table-wrap" hidden>
          <table class="history-table">
            <thead><tr><th scope="col">Наименование продукции</th><th scope="col">Количество (шт.)</th><th scope="col">Дата продажи</th></tr></thead>
            <tbody id="historyRows"></tbody>
          </table>
        </div>
      </main>
      <footer class="app-footer"><span>Партнерская сеть</span><span>CRM · 2026</span></footer>
    </div>
    <script type="module" src="history-app.js"></script>
  </body>
</html>
