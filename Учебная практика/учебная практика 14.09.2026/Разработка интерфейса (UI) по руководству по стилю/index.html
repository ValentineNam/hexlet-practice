<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM: Список партнеров и скидок</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <img class="app-icon" src="assets/favicon.svg" alt="Иконка приложения" />
          <h1>CRM: Список партнеров и скидок</h1>
        </div>
        <div class="company-logo" aria-label="Логотип компании">
          <img src="assets/logo.svg" alt="Логотип компании" />
        </div>
      </header>

      <main class="partners-list" aria-label="Список партнеров">
        <article class="partner-card">
          <div class="partner-meta">
            <div class="partner-line"><span class="label">Тип</span> | <span class="value">Наименование партнера</span></div>
            <div class="partner-line">Директор</div>
            <div class="partner-line">+7 223 322 22 32</div>
            <div class="partner-line">Рейтинг: 10</div>
          </div>
          <div class="partner-discount">10%</div>
        </article>

        <article class="partner-card">
          <div class="partner-meta">
            <div class="partner-line"><span class="label">Тип</span> | <span class="value">Наименование партнера</span></div>
            <div class="partner-line">Директор</div>
            <div class="partner-line">+7 223 322 22 32</div>
            <div class="partner-line">Рейтинг: 10</div>
          </div>
          <div class="partner-discount">10%</div>
        </article>

        <article class="partner-card">
          <div class="partner-meta">
            <div class="partner-line"><span class="label">Тип</span> | <span class="value">Наименование партнера</span></div>
            <div class="partner-line">Директор</div>
            <div class="partner-line">+7 223 322 22 32</div>
            <div class="partner-line">Рейтинг: 10</div>
          </div>
          <div class="partner-discount">10%</div>
        </article>
      </main>
    </div>
  </body>
</html>
