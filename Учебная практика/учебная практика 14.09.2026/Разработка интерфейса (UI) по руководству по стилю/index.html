<!DOCTYPE html>

  <head>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <img class="app-icon" src="assets/favicon.svg" alt="Иконка приложения" />
          <h1>CRM: Список партнеров и скидок</h1>
        </div>
      </header>

      <main id="partnersList" class="partners-list" aria-label="Список партнеров"></main>

    <script type="module" src="partners-data.js"></script>
    <script type="module">
      import { renderPartners } from './render.js';
      const list = document.getElementById('partnersList');
      renderPartners(list, window.partnersDb);
    </script>
  </body>
</html>
